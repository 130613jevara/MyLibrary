<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Library ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #fff5f7 50%, #f0e8ff 100%);
            min-height: 100vh;
            color: #4a4a4a;
        }
        header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fda085 100%);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(255, 154, 158, 0.3);
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '✨';
            position: absolute;
            font-size: 40px;
            top: 20px;
            left: 10%;
            animation: float 3s ease-in-out infinite;
        }
        header::after {
            content: '🌸';
            position: absolute;
            font-size: 35px;
            top: 30px;
            right: 10%;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        header p {
            color: white;
            font-size: 18px;
            font-weight: 500;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .search-bar {
            margin: 30px 0;
            text-align: center;
        }
        .search-bar input {
            padding: 15px 20px;
            width: 350px;
            max-width: 90%;
            border: 3px solid #ffd1dc;
            border-radius: 30px;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #ff9a9e;
            box-shadow: 0 0 15px rgba(255, 154, 158, 0.3);
        }
        .search-bar button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 16px;
            margin-left: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
        }
        .search-bar button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.4);
        }
        .add-book-section {
            background: white;
            padding: 35px;
            margin: 30px 0;
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(255, 154, 158, 0.15);
            border: 3px solid #ffd1dc;
        }
        .add-book-section h2 {
            font-family: 'Playfair Display', serif;
            color: #ff6b9d;
            margin-bottom: 25px;
            font-size: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ff6b9d;
            font-size: 15px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #ffd1dc;
            border-radius: 15px;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fffbfc;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff9a9e;
            background: white;
            box-shadow: 0 0 10px rgba(255, 154, 158, 0.2);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .submit-btn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #ff6b9d;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 237, 234, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(168, 237, 234, 0.5);
        }
        .success {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            color: #2d5016;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 15px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(150, 230, 161, 0.3);
        }
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        .book-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.15);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .book-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff9a9e, #fecfef, #fda085);
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(255, 154, 158, 0.25);
            border-color: #ffd1dc;
        }
        .book-card h3 {
            font-family: 'Playfair Display', serif;
            color: #ff6b9d;
            margin-bottom: 12px;
            font-size: 24px;
            line-height: 1.3;
        }
        .book-card .author {
            color: #9b59b6;
            font-style: italic;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 16px;
        }
        .book-card .meta {
            font-size: 14px;
            color: #a29bfe;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .book-card .description {
            margin-top: 15px;
            line-height: 1.7;
            color: #666;
            font-size: 15px;
        }
        .book-card .added-by {
            margin-top: 15px;
            font-size: 13px;
            color: #ffb6c1;
            font-weight: 600;
            padding-top: 15px;
            border-top: 2px solid #fff0f5;
        }
        .book-count {
            margin-top: 50px;
            font-size: 28px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: #ff6b9d;
            text-align: center;
        }
        .emoji-decoration {
            display: inline-block;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>✨ My Little Library 💕</h1>
        <p>where bookworms bloom and stories sparkle</p>
    </header>

    <div class="container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="search for magical books... 🔍">
            <button onclick="searchBooks()">Search</button>
            <button onclick="clearSearch()">Clear</button>
        </div>

        <div class="add-book-section">
            <h2>✨ Add Your Favorite Book</h2>
            <div id="successMessage" class="success" style="display: none;"></div>
            
            <form id="addBookForm">
                <div class="form-group">
                    <label for="title">📖 Book Title *</label>
                    <input type="text" id="title" required placeholder="e.g., Little Women">
                </div>
                
                <div class="form-group">
                    <label for="author">✍️ Author *</label>
                    <input type="text" id="author" required placeholder="e.g., Louisa May Alcott">
                </div>
                
                <div class="form-group">
                    <label for="year">📅 Year Published</label>
                    <input type="number" id="year" min="1000" max="2100" placeholder="e.g., 1868">
                </div>
                
                <div class="form-group">
                    <label for="genre">🌸 Genre</label>
                    <input type="text" id="genre" placeholder="e.g., Romance, Fantasy, Mystery">
                </div>
                
                <div class="form-group">
                    <label for="description">💭 What's it about?</label>
                    <textarea id="description" placeholder="Share what makes this book special..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="addedBy">💌 Your Name *</label>
                    <input type="text" id="addedBy" required placeholder="e.g., Sarah">
                </div>
                
                <button type="submit" class="submit-btn">Add to Library ✨</button>
            </form>
        </div>

        <h2 class="book-count">
            <span class="emoji-decoration">📚</span>
            Our Collection 
            <span class="emoji-decoration">(<span id="bookCount">0</span> books)</span>
            <span class="emoji-decoration">🌷</span>
        </h2>
        
        <div id="booksGrid" class="books-grid"></div>
    </div>

    <script>
        let books = [
            {
                title: 'To Kill a Mockingbird',
                author: 'Harper Lee',
                year: 1960,
                genre: 'Fiction',
                description: 'A classic novel about racial injustice in the American South.',
                addedBy: 'Emma',
                dateAdded: new Date('2024-01-01')
            },
            {
                title: '1984',
                author: 'George Orwell',
                year: 1949,
                genre: 'Dystopian',
                description: 'A dystopian social science fiction novel and cautionary tale.',
                addedBy: 'Lily',
                dateAdded: new Date('2024-01-02')
            },
            {
                title: 'The Great Gatsby',
                author: 'F. Scott Fitzgerald',
                year: 1925,
                genre: 'Fiction',
                description: 'A novel about the American dream and the Jazz Age.',
                addedBy: 'Sophie',
                dateAdded: new Date('2024-01-03')
            },
            {
                title: 'Pride and Prejudice',
                author: 'Jane Austen',
                year: 1813,
                genre: 'Romance',
                description: 'A romantic novel of manners set in Georgian England.',
                addedBy: 'Olivia',
                dateAdded: new Date('2024-01-04')
            },
            {
                title: 'The Catcher in the Rye',
                author: 'J.D. Salinger',
                year: 1951,
                genre: 'Fiction',
                description: 'A story about teenage rebellion and alienation.',
                addedBy: 'Ava',
                dateAdded: new Date('2024-01-05')
            },
            {
                title: 'The Hobbit',
                author: 'J.R.R. Tolkien',
                year: 1937,
                genre: 'Fantasy',
                description: 'A fantasy novel about the quest of Bilbo Baggins.',
                addedBy: 'Mia',
                dateAdded: new Date('2024-01-06')
            },
            {
                title: 'Harry Potter and the Sorcerer\'s Stone',
                author: 'J.K. Rowling',
                year: 1997,
                genre: 'Fantasy',
                description: 'The first book in the Harry Potter series.',
                addedBy: 'Isabella',
                dateAdded: new Date('2024-01-07')
            },
            {
                title: 'The Lord of the Rings',
                author: 'J.R.R. Tolkien',
                year: 1954,
                genre: 'Fantasy',
                description: 'An epic high-fantasy novel.',
                addedBy: 'Charlotte',
                dateAdded: new Date('2024-01-08')
            },
            {
                title: 'Animal Farm',
                author: 'George Orwell',
                year: 1945,
                genre: 'Satire',
                description: 'An allegorical novella about Soviet totalitarianism.',
                addedBy: 'Amelia',
                dateAdded: new Date('2024-01-09')
            },
            {
                title: 'Brave New World',
                author: 'Aldous Huxley',
                year: 1932,
                genre: 'Dystopian',
                description: 'A dystopian novel set in a futuristic World State.',
                addedBy: 'Harper',
                dateAdded: new Date('2024-01-10')
            }
        ];

        function displayBooks(booksToShow) {
            const grid = document.getElementById('booksGrid');
            const bookCount = document.getElementById('bookCount');
            
            bookCount.textContent = booksToShow.length;
            
            if (booksToShow.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #ffb6c1; font-size: 18px;">No books found yet... be the first to add one! 🌸</p>';
                return;
            }
            
            grid.innerHTML = booksToShow.map(book => `
                <div class="book-card">
                    <h3>${escapeHtml(book.title)}</h3>
                    <div class="author">by ${escapeHtml(book.author)}</div>
                    <div class="meta">
                        ${book.year ? `<span>${book.year}</span>` : ''}
                        ${book.genre ? ` • ${escapeHtml(book.genre)}` : ''}
                    </div>
                    ${book.description ? `<div class="description">${escapeHtml(book.description)}</div>` : ''}
                    <div class="added-by">
                        💕 Added by ${escapeHtml(book.addedBy)} on ${formatDate(book.dateAdded)}
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(date) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(date).toLocaleDateString('en-US', options);
        }

        function searchBooks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (!searchTerm) {
                displayBooks(books);
                return;
            }
            
            const filtered = books.filter(book => 
                book.title.toLowerCase().includes(searchTerm) || 
                book.author.toLowerCase().includes(searchTerm)
            );
            displayBooks(filtered);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            displayBooks(books);
        }

        document.getElementById('addBookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newBook = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                year: document.getElementById('year').value ? parseInt(document.getElementById('year').value) : null,
                genre: document.getElementById('genre').value,
                description: document.getElementById('description').value,
                addedBy: document.getElementById('addedBy').value,
                dateAdded: new Date()
            };
            
            books.unshift(newBook);
            displayBooks(books);
            
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = '✨ Yay! Your book was added successfully! 💕';
            successMsg.style.display = 'block';
            
            this.reset();
            
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });

        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                searchBooks();
            }
        });

        displayBooks(books);
    </script>
</body>
</html>
